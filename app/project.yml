name: Sapu
options:
  bundleIdPrefix: cc.arsyad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
targets:
  Sapu:
    type: application
    platform: macOS
    sources:
      - Sapu
    info:
      path: Sapu/Info.plist
      properties:
        CFBundleDisplayName: Sapu
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Free software licensed under GPL-3.0. Cleanup engine based on Mole (github.com/tw93/Mole)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.arsyad.sapu
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Bundle engine
        script: '"${PROJECT_DIR}/../scripts/bundle-engine.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine"'
        basedOnDependencyAnalysis: false
